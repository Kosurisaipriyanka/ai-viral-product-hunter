services:
  - type: web
    name: ai-viral-product-hunter-api
    runtime: python
    buildCommand: pip install .
    startCommand: uvicorn api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
  - type: web
    name: ai-viral-product-hunter-dashboard
    runtime: python
    buildCommand: pip install .
    startCommand: streamlit run app.py --server.address 0.0.0.0 --server.port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: API_URL
        sync: false
