[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-viral-product-hunter"
version = "0.4.0"
description = "A beginner-friendly product research dashboard with transparent discovery sources."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "streamlit>=1.40,<2.0",
  "pandas>=2.2,<3.0",
  "requests>=2.32,<3.0",
  "python-dotenv>=1.0,<2.0",
  "pytrends>=4.9,<5.0",
  "urllib3>=1.26,<2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0", "httpx>=0.27,<1.0"]

[tool.setuptools]
py-modules = ["api", "app", "discovery", "catalog", "scoring", "youtube_discovery", "product_filter", "product_decisions", "agent_research"]

[tool.pytest.ini_options]
testpaths = ["tests"]
