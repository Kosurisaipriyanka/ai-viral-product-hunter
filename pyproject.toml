[project]
name = "ai-viral-product-hunter"
version = "0.1.0"
description = "A beginner-friendly product research dashboard, starting with clearly labelled sample data."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "streamlit>=1.40,<2.0",
  "pandas>=2.2,<3.0",
  "requests>=2.32,<3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0", "httpx>=0.27,<1.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
